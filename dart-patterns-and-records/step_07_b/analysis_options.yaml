include: ../../analysis_options.yaml

analyzer:
  errors:
    unused_field: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: false
    strict-inference: false

linter:
  rules:
    - prefer_final_in_for_each
