version: 2
updates:
  # GitHub Actions ecosystem.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Don't auto-submit GitHub Action updates until
    # subosito/flutter-action update is cleared.
    # labels:
    #   - "autosubmit"

  # Pub ecosystem. Group each dependency across the steps of a codelab.
  - package-ecosystem: "pub"
    versioning-strategy: "increase-if-necessary"
    directories:
      - "/animated-responsive-layout/step_*"
    schedule:
      interval: "daily"
    labels:
      - "autosubmit"
    groups:
      animated-responsive-layout:
        group-by: "dependency-name"

  - package-ecosystem: "pub"
    versioning-strategy: "increase-if-necessary"
